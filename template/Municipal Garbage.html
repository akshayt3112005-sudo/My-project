{% extends 'navbar.html' %}
{% load static %}
{% block content %}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Cone – Siris Safety</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #135BAE;
      --secondary: #001248;
      --accent:    #FF5E15;
      --white:     #ffffff;
      --gray-50:   #f9fafb;
      --gray-100:  #f3f4f6;
      --gray-200:  #e5e7eb;
      --gray-400:  #9ca3af;
      --gray-600:  #4b5563;
      --green-wa:  #25D366;
      --green-wa-dark: #128C7E;
    }

    body {
      font-family: 'Roboto', sans-serif;
      color: var(--secondary);
      background: #fff;
      line-height: 1.6;
    }

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* TOP BAR */
    
    /* HERO */
    .page-banner {
    position: relative;
    width: 100%;
    height: 400px;
    overflow: hidden;
}

.banner-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.banner-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
}

.banner-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100%;
    z-index: 2;
}

.banner-content h1 {
    color: #fff;
    font-size: 55px;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0;
}

@media (max-width:768px) {
    .page-banner {
        height: 280px;
    }

    .banner-content h1 {
        font-size: 32px;
    }
}

    /* PRODUCTS SECTION */
    .products-section {
      padding: 80px 0;
      background: #fafbfc;
    }
    .section-header {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 64px;
    }
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 14px;
    }
    .section-header p { color: var(--gray-600); font-size: 17px; }

    .products-list { display: flex; flex-direction: column; gap: 80px; }

    .product-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .product-row.reverse { direction: rtl; }
    .product-row.reverse > * { direction: ltr; }

    .product-image-wrap {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
      overflow: hidden;
      position: relative;
      transition: transform .3s;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ================= Product Image Carousel ================= */

.product-image-wrap .carousel {
    width: 100%;
    height: 100%;
}

.product-image-wrap .carousel-inner {
    width: 100%;
    height: 100%;
}

.product-image-wrap .carousel-item {
    height: 100%;
}

.product-image-wrap .carousel-item img {
    width: 100%;
    height: 340px;
    object-fit: contain;
    mix-blend-mode: multiply;
}

/* Carousel buttons */

.product-image-wrap .carousel-control-prev,
.product-image-wrap .carousel-control-next {
    width: 45px;
    height: 45px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.5);
    border-radius: 50%;
    opacity: 1;
}

.product-image-wrap .carousel-control-prev {
    left: 10px;
}

.product-image-wrap .carousel-control-next {
    right: 10px;
}

.product-image-wrap .carousel-control-prev-icon,
.product-image-wrap .carousel-control-next-icon {
    width: 20px;
    height: 20px;
}
    .product-image-wrap:hover { transform: translateY(-6px); }
/* ================= PRODUCT IMAGE ================= */

.product-image-wrap {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

    width: 100%;
    height: 520px;

    overflow: hidden;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}

.product-image-wrap:hover {
    transform: none;
}

/* Carousel */

.product-image-wrap .carousel {
    width: 100%;
    height: 100%;
}

.product-image-wrap .carousel-inner {
    width: 100%;
    height: 100%;
}

.product-image-wrap .carousel-item {
    width: 100%;
    height: 100%;

    display: none;
    align-items: center;
    justify-content: center;
}

.product-image-wrap .carousel-item.active {
    display: flex;
}

/* Product image */

.product-image-wrap .carousel-item img {
    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 460px;

    object-fit: contain;

    display: block;

    mix-blend-mode: normal;
}

/* ================= CAROUSEL ARROWS ================= */

.product-image-wrap .carousel-control-prev,
.product-image-wrap .carousel-control-next {

    width: 44px;
    height: 44px;

    top: 50%;
    transform: translateY(-50%);

    background: rgba(0, 20, 60, 0.75);

    border-radius: 50%;

    opacity: 0;

    transition: all 0.3s ease;
}

.product-image-wrap:hover .carousel-control-prev,
.product-image-wrap:hover .carousel-control-next {
    opacity: 1;
}

.product-image-wrap .carousel-control-prev {
    left: 15px;
}

.product-image-wrap .carousel-control-next {
    right: 15px;
}

.product-image-wrap .carousel-control-prev:hover,
.product-image-wrap .carousel-control-next:hover {
    background: #135BAE;
    transform: translateY(-50%) scale(1.08);
}

.product-image-wrap .carousel-control-prev-icon,
.product-image-wrap .carousel-control-next-icon {
    width: 18px;
    height: 18px;
}
    .product-image-wrap:hover img { transform: scale(1.05); }

    .product-content { display: flex; flex-direction: column; gap: 20px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(19,91,174,.1);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .badge svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.2;
    }
    .product-desc { color: var(--gray-600); font-size: 16px; line-height: 1.75; }

    .specs-box {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .specs-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      font-weight: 600;
      font-size: 14px;
      color: var(--secondary);
    }
    .specs-header svg { width: 16px; height: 16px; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .specs-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .specs-table tr { border-bottom: 1px solid var(--gray-100); }
    .specs-table tr:last-child { border-bottom: none; }
    .specs-table tr:hover { background: rgba(0,0,0,.015); }
    .specs-table td { padding: 11px 16px; }
    .specs-table td:first-child {
      font-weight: 700;
      color: var(--secondary);
      background: rgba(0,0,0,.015);
      width: 36%;
    }
    .specs-table td:last-child { color: var(--gray-600); }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green-wa);
      color: #fff;
      padding: 13px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37,211,102,.38);
      transition: background .2s, box-shadow .2s, transform .15s;
      width: max-content;
    }
    .btn-whatsapp:hover {
      background: var(--green-wa-dark);
      box-shadow: 0 6px 20px rgba(37,211,102,.55);
      transform: translateY(-2px);
    }
    .btn-whatsapp:active { transform: translateY(0); }
    .btn-whatsapp svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* FOOTER */
    
  </style>


<!-- HERO -->
<section class="page-banner">

    <!-- Background Image -->
    <img src="{% static 'image/b.jpg' %}" alt="Banner" class="banner-img">
    <!-- Overlay -->
    <div class="banner-overlay"></div>

    <!-- Center Text -->
    <div class="banner-content">
        <h1>MS Garbage Trolley</h1>
    </div>

</section>

<!-- PRODUCTS -->
<section class="products-section">
  <div class="container">
    <div class="section-header">
      <h2>Traffic Safety Solutions</h2>
      <p>High-visibility, durable traffic cones and accessories designed for effective road and industrial safety.</p>
    </div>
    <div class="products-list" id="products-list"></div>
  </div>
</section>

<!-- FOOTER -->


<script>
  const products = [
    {
      title: "Municipal Garbage Collection Trolley",
      images: [
    "{% static 'image/p.png' %}",
    "{% static 'image/p2.png' %}",
    "{% static 'image/p3.png' %}"
],
      
      description: "A heavy-duty Municipal Garbage Collection Trolley designed for efficient waste collection and transportation. Manufactured from high-quality MS steel with a powder-coated finish for long-lasting performance.",
      specs: [
        ["Material", "Heavy-duty Mild Steel (MS) construction"],
        ["Capacity", "300–500 Litres (Approx.)"],
        ["Finish", "Powder-coated, rust-resistant finish"],
        ["Mobility", "4 heavy-duty swivel caster wheels"],
        ["Application", "Municipal waste collection, parks, industries, commercial areas"]
      ]
    }
  ];

  const iconCheck = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
  const iconSpec  = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`;
  const iconWA    = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`;

  const list = document.getElementById('products-list');

  products.forEach((p, i) => {
    const isReverse = i % 2 === 1;

    const specsRows = p.specs.map(([label, value]) => `
      <tr><td>${label}</td><td>${value}</td></tr>
    `).join('');

const carouselId = `productCarousel${i}`;

const imageCol = `
<div class="product-image-wrap">

    <div id="${carouselId}" 
         class="carousel slide" 
         data-bs-ride="carousel">

        <div class="carousel-inner">

            ${p.images.map((image, index) => `
                <div class="carousel-item ${index === 0 ? 'active' : ''}">

                    <img 
                        src="${image}"
                        alt="${p.title}"
                        loading="lazy"
                        onerror="this.src='https://placehold.co/480x480/f3f4f6/9ca3af?text=Product+Image'"
                    >

                </div>
            `).join('')}

        </div>

        <!-- Previous -->
        <button 
            class="carousel-control-prev"
            type="button"
            data-bs-target="#${carouselId}"
            data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

            <span class="visually-hidden">
                Previous
            </span>

        </button>

        <!-- Next -->
        <button 
            class="carousel-control-next"
            type="button"
            data-bs-target="#${carouselId}"
            data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

            <span class="visually-hidden">
                Next
            </span>

        </button>

    </div>

</div>`;

    const contentCol = `
      <div class="product-content">
        <div>
          <span class="badge">${iconCheck} Traffic Safety Product</span>
          <h3 class="product-title" style="margin-top:14px">${p.title}</h3>
          <p class="product-desc" style="margin-top:12px">${p.description}</p>
        </div>
        <div class="specs-box">
          <div class="specs-header">${iconSpec} Product Specifications</div>
          <table class="specs-table"><tbody>${specsRows}</tbody></table>
        </div>
        <div>
          <a class="btn-whatsapp"
            href="https://wa.me/9767928649?text=Hello%20I%20am%20interested%20in%20your%20products"
            target="_blank" rel="noopener noreferrer">
            ${iconWA} WhatsApp Inquiry
          </a>
        </div>
      </div>`;

    const row = document.createElement('div');
    row.className = 'product-row' + (isReverse ? ' reverse' : '');
    row.innerHTML = isReverse ? contentCol + imageCol : imageCol + contentCol;
    list.appendChild(row);
  });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 {% include 'footer.html' %}
