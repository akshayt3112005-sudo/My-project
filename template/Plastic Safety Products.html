{% extends 'navbar.html' %}
{% load static %}
{% block content %}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Cone – Siris Safety</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #135BAE;
      --secondary: #001248;
      --accent:    #FF5E15;
      --white:     #ffffff;
      --gray-50:   #f9fafb;
      --gray-100:  #f3f4f6;
      --gray-200:  #e5e7eb;
      --gray-400:  #9ca3af;
      --gray-600:  #4b5563;
      --green-wa:  #25D366;
      --green-wa-dark: #128C7E;
    }

    body {
      font-family: 'Roboto', sans-serif;
      color: var(--secondary);
      background: #fff;
      line-height: 1.6;
    }

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* TOP BAR */
    
    

    /* HERO */
    .page-banner {
    position: relative;
    width: 100%;
    height: 400px;
    overflow: hidden;
}

.banner-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.banner-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
}

.banner-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100%;
    z-index: 2;
}

.banner-content h1 {
    color: #fff;
    font-size: 55px;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0;
}

@media (max-width:768px) {
    .page-banner {
        height: 280px;
    }

    .banner-content h1 {
        font-size: 32px;
    }
}

    /* PRODUCTS SECTION */
    .products-section {
      padding: 80px 0;
      background: #fafbfc;
    }
    .section-header {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 64px;
    }
    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 14px;
    }
    .section-header p { color: var(--gray-600); font-size: 17px; }

    .products-list { display: flex; flex-direction: column; gap: 80px; }

    .product-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .product-row.reverse { direction: rtl; }
    .product-row.reverse > * { direction: ltr; }

    .product-image-wrap {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
      overflow: hidden;
      position: relative;
      transition: transform .3s;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .product-image-wrap:hover { transform: translateY(-6px); }
    .product-image-wrap img {
      max-height: 340px;
      width: 100%;
      object-fit: contain;
      transition: transform .5s;
      mix-blend-mode: multiply;
    }
    .product-image-wrap:hover img { transform: scale(1.05); }

    .product-content { display: flex; flex-direction: column; gap: 20px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(19,91,174,.1);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 6px 14px;
      border-radius: 999px;
    }
    .badge svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .product-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.2;
    }
    .product-desc { color: var(--gray-600); font-size: 16px; line-height: 1.75; }

    .specs-box {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .specs-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      font-weight: 600;
      font-size: 14px;
      color: var(--secondary);
    }
    .specs-header svg { width: 16px; height: 16px; fill: none; stroke: var(--primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .specs-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .specs-table tr { border-bottom: 1px solid var(--gray-100); }
    .specs-table tr:last-child { border-bottom: none; }
    .specs-table tr:hover { background: rgba(0,0,0,.015); }
    .specs-table td { padding: 11px 16px; }
    .specs-table td:first-child {
      font-weight: 700;
      color: var(--secondary);
      background: rgba(0,0,0,.015);
      width: 36%;
    }
    .specs-table td:last-child { color: var(--gray-600); }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green-wa);
      color: #fff;
      padding: 13px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(37,211,102,.38);
      transition: background .2s, box-shadow .2s, transform .15s;
      width: max-content;
    }
    .btn-whatsapp:hover {
      background: var(--green-wa-dark);
      box-shadow: 0 6px 20px rgba(37,211,102,.55);
      transform: translateY(-2px);
    }
    .btn-whatsapp:active { transform: translateY(0); }
    .btn-whatsapp svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* FOOTER */
    
  </style>


<!-- HERO -->
<section class="page-banner">
